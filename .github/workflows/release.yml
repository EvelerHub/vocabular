name: Release

# Trigger by pushing a version tag: git tag v1.2.3 && git push origin v1.2.3
# Or run manually from the Actions tab with a version number.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0, without the v prefix)'
        required: true

jobs:
  release:
    name: Build & Release (Chrome + Firefox)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      # When triggered manually there is no git tag yet — create one so the
      # release action has something to attach the release to.
      - name: Create tag (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      - name: Update version in manifests
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" manifest.chrome.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" manifest.firefox.json

      # ── Chrome ─────────────────────────────────────────────────────────────

      - name: Build Chrome
        run: |
          mkdir -p dist/chrome
          rsync -a \
            --exclude="manifest.chrome.json" \
            --exclude="manifest.firefox.json" \
            --exclude="manifest.json" \
            --exclude="dist/" \
            --exclude=".github/" \
            --exclude=".kiro/" \
            --exclude=".idea/" \
            --exclude=".gitignore" \
            --exclude="build.sh" \
            --exclude=".git/" \
            . dist/chrome/
          cp manifest.chrome.json dist/chrome/manifest.json

      - name: Package Chrome (.zip)
        run: |
          cd dist/chrome
          zip -r ../../vocabular-chrome-${{ steps.version.outputs.VERSION }}.zip .

      # ── Firefox ────────────────────────────────────────────────────────────

      - name: Build Firefox
        run: |
          mkdir -p dist/firefox
          rsync -a \
            --exclude="manifest.chrome.json" \
            --exclude="manifest.firefox.json" \
            --exclude="manifest.json" \
            --exclude="dist/" \
            --exclude=".github/" \
            --exclude=".kiro/" \
            --exclude=".idea/" \
            --exclude=".gitignore" \
            --exclude="build.sh" \
            --exclude=".git/" \
            . dist/firefox/
          cp manifest.firefox.json dist/firefox/manifest.json

      - name: Package Firefox (.zip)
        run: |
          cd dist/firefox
          zip -r ../../vocabular-firefox-${{ steps.version.outputs.VERSION }}.zip .

      # ── Release notes ───────────────────────────────────────────────────────
      # Extracts the "## [<version>]" section from CHANGELOG.md and prepends it
      # to the installation instructions.

      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            echo "::warning::No section for $VERSION in CHANGELOG.md"
            echo "_No changelog entry for this version._" > changes.md
          fi
          {
            echo "## What's new"
            echo
            cat changes.md
            echo
            sed "s/__VERSION__/$VERSION/g" .github/release-install.md
          } > release-notes.md

      # ── GitHub Release ──────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Vocabular v${{ steps.version.outputs.VERSION }}"
          body_path: release-notes.md
          files: |
            vocabular-chrome-${{ steps.version.outputs.VERSION }}.zip
            vocabular-firefox-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
